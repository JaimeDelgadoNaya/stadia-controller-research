name: Phase 99 - source contract and signed ReadMemory static audit

on:
  pull_request:
    paths:
      - 'research/phase99/**'
      - 'tests/test_romc_and_readmemory_phase99.py'
      - '.github/workflows/phase99-romc-and-loader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-original-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 12 synthetic gates without proprietary input
        run: python -m unittest discover -s tests -p 'test_romc_and_readmemory_phase99.py' -v
      - name: Install bounded ARM Thumb decoder
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Download public original signed loader and check whole-file hash
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/signed-loader.bin" \
            "https://raw.githubusercontent.com/StadiaMemories/firmware/main/restricted_ivt_flashloader.bin"
          echo "c39ea8962cc3094a9167ba80634f1ea0652b747b4572d1de2802d9f2f4e144c5  $RUNNER_TEMP/signed-loader.bin" | sha256sum --check
      - name: Decode bounded ReadMemory command and handlers offline
        run: |
          python -m research.phase99.audit_signed_readmemory \
            "$RUNNER_TEMP/signed-loader.bin" --out phase99-signed-readmemory.json
      - name: Reconstruct signed loader initialized range-table pointers statically
        run: |
          python -m research.phase99.trace_read_policy \
            "$RUNNER_TEMP/signed-loader.bin" --out phase99-range-pointer.json
      - name: Archive text-only evidence (no OEM binary)
        uses: actions/upload-artifact@v4
        with:
          name: phase99-signed-readmemory-static
          path: |
            phase99-signed-readmemory.json
            phase99-range-pointer.json
          retention-days: 30
