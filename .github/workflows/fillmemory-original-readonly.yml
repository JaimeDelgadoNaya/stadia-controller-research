name: Pinned original FillMemory offline audit

on:
  pull_request:
    paths:
      - 'tools/audit_fillmemory_*'
      - 'tests/test_fillmemory_*'
      - '.github/workflows/fillmemory-original-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-original-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install static audit dependencies
        run: python -m pip install -r requirements.txt
      - name: Obtain archived signed sample and enforce exact hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stadia-audit
          curl --fail --location --silent --show-error --retry 3 --max-time 45 \
            'https://raw.githubusercontent.com/StadiaMemories/firmware/main/restricted_ivt_flashloader.bin' \
            -o /tmp/stadia-audit/loader.bin
          echo 'c39ea8962cc3094a9167ba80634f1ea0652b747b4572d1de2802d9f2f4e144c5  /tmp/stadia-audit/loader.bin' | sha256sum -c -
      - name: Audit original without transmitting packets or publishing firmware
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.audit_fillmemory_verified /tmp/stadia-audit/loader.bin --out /tmp/stadia-audit/verified.json
          python -m tools.audit_fillmemory_cfg /tmp/stadia-audit/loader.bin --out /tmp/stadia-audit/graph.json
          python -m tools.audit_fillmemory_overflow /tmp/stadia-audit/loader.bin --print-disassembly
          python -m tools.audit_fillmemory_wrap_model /tmp/stadia-audit/loader.bin --out /tmp/stadia-audit/wrap.json
          python -m tools.audit_fillmemory_dynamic_guard /tmp/stadia-audit/loader.bin --summary --out /tmp/stadia-audit/guard.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/stadia-audit")
          verified = json.loads((root / "verified.json").read_text())
          graph = json.loads((root / "graph.json").read_text())
          wrap = json.loads((root / "wrap.json").read_text())
          guard = json.loads((root / "guard.json").read_text())
          print("Hash verified:", verified["sha256_matches_original"])
          print("Fill/Write shared policy:", verified["range_policy_shared"])
          print("Fill/Write operation IDs:", verified["policy_operation"])
          print("Fill allowed intervals:", verified["fill_ranges"])
          print("Normal patch of Execute/Call flags:",
                verified["normal_positive_nonwrapping_fill_to_execution_flags"])
          print("Bounded graph indirect limitations:", graph["unresolved_or_unmodeled"])
          print("Wrapped interval model (bounded prechecks only):", [(x["field"], x["wrapped_candidate_passes_policy_precheck"], x["wrapped_candidate_matches_initial_memory_map"], x["required_length_exceeds_mapped_ram"]) for x in wrap["control_fields_offline_scenarios"]])
          print("Dynamic guard fields:", guard["provenance"]["guard_fields"])
          print("Guard RAM state has been physically measured:", guard["provenance"]["initial_context_bytes_known"])
          print("WARNING: runtime protected-region values and backend effect unverified.")
          print("No custom execution, bypass or recovery inferred.")
          PY
      - name: Remove temporary image and analysis files
        if: always()
        run: rm -rf /tmp/stadia-audit
