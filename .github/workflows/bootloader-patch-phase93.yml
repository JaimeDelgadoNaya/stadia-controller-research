name: Phase 93 private bootloader and RAM flashloader parser tests

on:
  pull_request:
    paths:
      - 'tools/audit_community_bootloader_patch_phase93.py'
      - 'tools/audit_nxp_ram_flashloader_phase93.py'
      - 'tests/test_community_bootloader_patch_phase93.py'
      - 'tests/test_nxp_ram_flashloader_phase93.py'
      - '.github/workflows/bootloader-patch-phase93.yml'
  push:
    branches: [main]
    paths:
      - 'tools/audit_community_bootloader_patch_phase93.py'
      - 'tools/audit_nxp_ram_flashloader_phase93.py'
      - 'tests/test_community_bootloader_patch_phase93.py'
      - 'tests/test_nxp_ram_flashloader_phase93.py'
      - '.github/workflows/bootloader-patch-phase93.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-bootloader-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test OEM-to-CDC descriptor patch parser with synthetic images
        run: python -m unittest tests.test_community_bootloader_patch_phase93 -v
      - name: Test NXP-style RAM flashloader parser with synthetic images
        run: python -m unittest tests.test_nxp_ram_flashloader_phase93 -v
