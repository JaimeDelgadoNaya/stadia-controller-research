name: Phase 98 - disassemble SHA-verified public RT1060 ROM

on:
  pull_request:
    paths:
      - 'research/phase98/**'
      - 'tests/test_rom_static_phase98.py'
      - '.github/workflows/phase98-rom-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-rom-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM disassembler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm
      - name: Five fail-closed tests
        run: python -m unittest discover -s tests -p 'test_rom_static_phase98.py' -v
      - name: Fetch verified public RT1060 reference only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -o "$RUNNER_TEMP/rt1060-bootrom.bin" \
            "https://raw.githubusercontent.com/Zenofex/SoC-BootROMs/main/nxp/imxrt1060.bootrom.bin"
          echo "a5d9af17f0e21866774df91c1e634e955e72b1442aedd84c8aac8eefc8e58f8e  $RUNNER_TEMP/rt1060-bootrom.bin" | sha256sum --check
      - name: Inspect three ROM excerpts; no SDP/USB access
        shell: bash
        run: |
          set -euo pipefail
          python research/phase98/inspect_rom.py \
            "$RUNNER_TEMP/rt1060-bootrom.bin" \
            --out phase98-rom-disassembly.json
      - name: Store textual evidence only
        uses: actions/upload-artifact@v4
        with:
          name: public-rt1060-rom-excerpts-phase98
          path: phase98-rom-disassembly.json
          retention-days: 30
