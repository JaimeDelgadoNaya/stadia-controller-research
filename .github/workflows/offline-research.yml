name: Offline research tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline test requirements
        run: python -m pip install -r requirements-emulation.txt
      - name: Run offline test suite
        run: python -m unittest discover -s tests -v
      - name: Reproduce analysis without connected hardware
        run: |
          python tools/trace_write_path.py > /tmp/stadia-write-path.json
          python tools/model_ranges.py > /tmp/stadia-range-model.json
          python tools/emulate_range_check.py > /tmp/stadia-range-emulated.json
          python tools/emulate_storage.py > /tmp/stadia-storage-emulated.json

  nxp-phase81-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve public signed OEM samples after exact SHA-256 checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stadia-nxp81
          curl --fail --location --silent --show-error --retry 3 --max-time 60 \
            'https://raw.githubusercontent.com/StadiaMemories/firmware/main/bruce_pvt_a_prod_signed.bin' \
            -o /tmp/stadia-nxp81/bruce.bin
          curl --fail --location --silent --show-error --retry 3 --max-time 60 \
            'https://raw.githubusercontent.com/StadiaMemories/firmware/main/restricted_ivt_flashloader.bin' \
            -o /tmp/stadia-nxp81/loader.bin
          echo '466ddd2dbcd8d1a66e2826f25849a6e5e45d9bb7e696e3fe0d500af56a5507a3  /tmp/stadia-nxp81/bruce.bin' | sha256sum -c -
          echo 'c39ea8962cc3094a9167ba80634f1ea0652b747b4572d1de2802d9f2f4e144c5  /tmp/stadia-nxp81/loader.bin' | sha256sum -c -
      - name: Verify IVT and CSF offline; print metadata only
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.audit_nxp_rom_advisories_phase81 /tmp/stadia-nxp81/bruce.bin --sample bruce_prod --out /tmp/stadia-nxp81/bruce.json
          python -m tools.audit_nxp_rom_advisories_phase81 /tmp/stadia-nxp81/loader.bin --sample restricted_ram_loader --out /tmp/stadia-nxp81/loader.json
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('bruce','loader'):
              v=json.loads(Path('/tmp/stadia-nxp81/'+name+'.json').read_text())
              print(name, 'DCD null:',v['ivt']['dcd_is_null'],
                    'commands:',[c['name'] for c in v['csf']['commands']],
                    'deprecated:',v['csf']['deprecated_count'],
                    'unknown:',v['csf']['unknown_count'])
          print('ROM HAB version unknown; host-only file parsing.')
          PY
      - name: Delete temporary OEM files
        if: always()
        run: rm -rf /tmp/stadia-nxp81


  gotham-phase94-public-pvt:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/phase91-sdp-community-intake'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact Gotham PVT-A and PVT-B images from pinned repository commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gotham-phase94"
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            'https://raw.githubusercontent.com/StadiaMemories/firmware/c86e2a397a747ce51c0988cd967142e5324ef0f9/ota.282115.stable-channel.gotham-pvt-a.214f6fe20f7b993046c77a9245c5805b056882dc.bin' \
            -o "$RUNNER_TEMP/gotham-phase94/pvt-a.bin"
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            'https://raw.githubusercontent.com/StadiaMemories/firmware/c86e2a397a747ce51c0988cd967142e5324ef0f9/ota.282115.stable-channel.gotham-pvt-b.b252d0d5a16538621abfb09609746cabc0f33292.bin' \
            -o "$RUNNER_TEMP/gotham-phase94/pvt-b.bin"
          test "$(stat -c%s "$RUNNER_TEMP/gotham-phase94/pvt-a.bin")" = 4163944
          test "$(stat -c%s "$RUNNER_TEMP/gotham-phase94/pvt-b.bin")" = 4163944
      - name: Run static Gotham registry, URL and USB KVS marker audit
        run: |
          python -m tools.audit_gotham_kvs_registry_phase94 \
            "$RUNNER_TEMP/gotham-phase94/pvt-a.bin" \
            "$RUNNER_TEMP/gotham-phase94/pvt-b.bin" \
            --pvt-a-blob e87bbd94e3843746af39c5920725e0bcf2b42c54 \
            --pvt-b-blob 128c65d9a5b5f44d1d2a217e5c6502370958dd86 \
            > "$RUNNER_TEMP/gotham-phase94/report.json"
          python -m unittest tests.test_gotham_kvs_registry_phase94 -v
          python - "$RUNNER_TEMP/gotham-phase94/report.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          for label in ("pvt_a","pvt_b"):
              x=r[label]
              print(label, "size", x["size_bytes"], "sha256", x["sha256"], "git_blob", x["git_blob_sha1"])
              print(label, "registry", x["registry"])
              print(label, "selected keys", x["registry"]["selected_name_to_id"])
              print(label, "YetiGmsgUrl offsets", x["literal_offsets"]["YetiGmsgUrl"])
              print(label, "KVS markers", {k:x["literal_offsets"][k] for k in ("kvs_operations.cc","vendor_usb_task.cc","Missing key name","Failed to set value")})
          print("PVT comparison",r["comparison"])
          PY
      - name: Upload sanitized report only (no firmware binaries)
        uses: actions/upload-artifact@v4
        with:
          name: gotham-phase94-sanitized-report
          path: ${{ runner.temp }}/gotham-phase94/report.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary public firmware binaries
        if: always()
        run: rm -rf "$RUNNER_TEMP/gotham-phase94"
