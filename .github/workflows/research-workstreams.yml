name: Parallel research workstream regression gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-workstream:
    name: ${{ matrix.lane }} · synthetic regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        lane:
          - bruce
          - bootloader
          - nxp-hab
          - usb-hid
          - independent-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-emulation.txt
      - name: Execute scope-specific checks without controller access
        shell: bash
        env:
          TRACK: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          case "$TRACK" in
            bruce)
              python -m unittest \
                tests.test_src_gpr7_writers_phase88 \
                tests.test_bruce_gpr7_status_phase88 \
                tests.test_triage_src_gpr7_thumb_phase88 -v
              ;;
            bootloader)
              python -m unittest \
                tests.test_bootloader_update_transaction_phase86 \
                tests.test_bootloader_update_trigger_phase87 -v
              ;;
            nxp-hab)
              python -m unittest \
                tests.test_nxp_rom_advisories_phase81 \
                tests.test_hab_unlock_phase82 \
                tests.test_hab_rom_version_phase83 \
                tests.test_hab_rvt_literals_phase84 \
                tests.test_hab_rvt_failsafe_phase84 \
                tests.test_hab_failsafe_callers_phase85 -v
              ;;
            usb-hid)
              python -m unittest \
                tests.test_passive_usb_phase79 \
                tests.test_passive_usb_phase80 -v
              ;;
            independent-qa)
              python -m unittest discover -s tests -v
              ;;
            *)
              echo 'Unexpected scope' >&2
              exit 1
              ;;
          esac
          echo "Synthetic research validation passed for $TRACK."
