name: Phase 104 Cortex-M7 XUSB transport (offline)
on:
  push:
    paths:
      - 'firmware_codec/stadia_xusb_codec.*'
      - 'firmware_codec/stadia_xusb_transport.*'
      - 'tests/test_xusb_transport*'
      - 'tools/arm_phase104_headers/**'
      - '.github/workflows/phase104-xusb-transport.yml'
  pull_request:
    paths:
      - 'firmware_codec/stadia_xusb_codec.*'
      - 'firmware_codec/stadia_xusb_transport.*'
      - 'tests/test_xusb_transport*'
      - 'tools/arm_phase104_headers/**'
      - '.github/workflows/phase104-xusb-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-transport:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pure C + ARM Cortex-M7 compile and deterministic host-state tests
        run: |
          python -m unittest discover -s tests -p 'test_xusb_transport*phase104.py' -v
      - name: No retail firmware or device access
        run: |
          echo "Only relocatable ARM object compilation and localhost C/ctypes tests"
          echo "No USB hardware, driver binding, flash, SDP, HAB, or fuse operations"
